name: "lint"
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed-files:
    # Get changed files to filter jobs
    outputs:
      yamlfmt: ${{ steps.changes.outputs.yamlfmt_any_changed == 'true' }}
      golang: ${{ steps.changes.outputs.golang_any_changed == 'true' }}
      renovate: ${{ steps.changes.outputs.renovate_any_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes
        timeout-minutes: 3
        with:
          files_yaml: |
            yamlfmt:
              - '**.yml'
              - '**.yaml'
            golang:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
            renovate:
              - 'renovate.json'
  golint:
    name: go lint
    needs: changed-files
    if: ${{ needs.changed-files.outputs.golang == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: setup go
        timeout-minutes: 3
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: 'true'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{runner.os}}-${{runner.arch}}-${{hashFiles('.aqua/*.yaml')}} # Change key
          restore-keys: |
            v2-aqua-installer-${{runner.os}}-${{runner.arch}}-
      - name: setup aqua
        uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        timeout-minutes: 3
        with:
          aqua_version: v2.60.1
      - name: golangci-lint
        timeout-minutes: 5
        run: golangci-lint run
  gotest:
    name: go test
    needs: changed-files
    if: ${{ needs.changed-files.outputs.golang == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: setup go
        timeout-minutes: 3
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: 'true'
      - name: go test
        timeout-minutes: 5
        run: go test ./...
  typos:
    name: "Typos"
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' }}
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{runner.os}}-${{runner.arch}}-${{hashFiles('.aqua/*.yaml')}} # Change key
          restore-keys: |
            v2-aqua-installer-${{runner.os}}-${{runner.arch}}-
      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        timeout-minutes: 3
        with:
          aqua_version: v2.60.1
      - name: typos
        timeout-minutes: 3
        run: |
          typos --config .typos.toml .
  yamlfmt:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.yamlfmt == 'true' && github.actor != 'renovate[bot]' }}
    name: "Yaml"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{runner.os}}-${{runner.arch}}-${{hashFiles('.aqua/*.yaml')}} # Change key
          restore-keys: |
            v2-aqua-installer-${{runner.os}}-${{runner.arch}}-
      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        timeout-minutes: 3
        with:
          aqua_version: v2.60.1
      - name: yamlfmt
        timeout-minutes: 3
        run: |
          yamlfmt -lint .
  renovate:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.renovate == 'true' && github.actor != 'renovate[bot]' }}
    name: "Renovate validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
        with:
          strict: "true"
